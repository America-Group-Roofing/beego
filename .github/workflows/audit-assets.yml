name: Auditoría de imágenes BeeGo

on:
  push:
    branches: [develop]
    paths:
      - "assets/**"
      - "public/assets/LOTE 2/**"
      - "scripts/audit-lote2.py"
      - "scripts/audit-assets.py"
      - "scripts/build-web-assets.py"
      - ".github/workflows/audit-assets.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout rama develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Revisar originales
        run: python scripts/audit-assets.py
      - name: "Auditar LOTE 2: miniaturas, dimensiones y duplicados"
        run: python scripts/audit-lote2.py
      - name: Crear derivados WebP sin alterar originales
        run: python scripts/build-web-assets.py
      - name: Guardar inventario, miniaturas y archivos web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/asset-review/inventory.json docs/asset-review/contact-sheet.jpg docs/asset-review/web-derivatives.json docs/asset-review/lote2-manifest.json docs/asset-review/lote2-contact-1.jpg docs/asset-review/lote2-contact-2.jpg public/assets/
          if ! git diff --cached --quiet; then
            git commit -m "assets: actualizar derivados web y auditoría visual"
            git push origin HEAD:develop
          fi
