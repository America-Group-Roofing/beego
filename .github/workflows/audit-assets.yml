name: Auditoría de imágenes BeeGo

on:
  push:
    branches: [develop]
    paths:
      - "assets/**"
      - "scripts/audit-assets.py"
      - ".github/workflows/audit-assets.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout rama develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Verificar imágenes y generar miniaturas
        run: python scripts/audit-assets.py
      - name: Guardar inventario y hoja de revisión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/asset-review/inventory.json docs/asset-review/contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m "docs: actualizar inventario visual de assets"
            git push origin HEAD:develop
          fi
